  <text x="600" y="238" text-anchor="middle" font-size="14" fill="#D6E4F0">ens18 WAN x.x.x.x · ens21 GLPI 10.50.0.254</text>
  <text x="600" y="258" text-anchor="middle" font-size="14" fill="#D6E4F0">ens19 DMZ 192.168.10.254 · ens20 LAN 10.20.30.254</text>
  <text x="600" y="284" text-anchor="middle" font-size="14" font-style="italic" fill="#FFCA2C">routage + NAT vers Internet</text>

