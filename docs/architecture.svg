  <rect x="497" y="566" width="206" height="28" rx="14" fill="#2E75B6"/>
  <text x="600" y="585" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">GLPI 12.0.0 · MariaDB</text>

