  <text x="600" y="61" text-anchor="middle" font-size="14" fill="#595959">apt, GitHub (GLPI, agent), TeamViewer</text>

  <!-- WAN -->
  <line x1="600" y1="72" x2="600" y2="104" stroke="#2E75B6" stroke-width="3"/>
