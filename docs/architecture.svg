  <rect x="912" y="550" width="176" height="26" rx="13" fill="#D6E4F0"/>
  <text x="1000" y="568" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B3A6B">TeamViewer</text>

  <!-- flux d'inventaire -->
  <path d="M200,590 C 220,640 380,640 468,600" fill="none" stroke="#FFCA2C" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M1000,590 C 980,640 820,640 732,600" fill="none" stroke="#FFCA2C" stroke-width="3" marker-end="url(#ar)"/>
