# /etc/apache2/sites-available/glpi.conf — GLPI 12 sur Debian 13
#
# Depuis GLPI 11, la racine web DOIT être le dossier /public.
# Si on pointe sur /var/www/html/glpi, GLPI affiche seulement
# « The web server seems to be misconfigured ».
# Toutes les requêtes passent ensuite par public/index.php (routeur Symfony).
#
# Conséquence : les URL n'ont pas de /glpi devant.
#   interface      -> http://10.50.0.10/
#   inventaire     -> http://10.50.0.10/front/inventory.php
#
# Activation :
#   a2enmod rewrite
#   a2ensite glpi.conf && a2dissite 000-default.conf
#   apache2ctl configtest && systemctl reload apache2

<VirtualHost *:80>
    ServerName 10.50.0.10
    DocumentRoot /var/www/html/glpi/public

    <Directory /var/www/html/glpi/public>
        Require all granted

        RewriteEngine On

        # Transmet l'en-tête Authorization à PHP (API, jetons)
        RewriteCond %{HTTP:Authorization} ^(.+)$
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

        # Tout ce qui n'est pas un fichier réel part vers le routeur GLPI
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/glpi_error.log
    CustomLog ${APACHE_LOG_DIR}/glpi_access.log combined
</VirtualHost>
